interface:
  display_name: "PPT Skill"
  short_description: "Build decks from an idea, an outline or an existing PPT (beautify) with a template library, outline review, concurrent slide drawing and PDF / PPTX / editable PPTX export."
  default_prompt: "Use $ppt-skill to make a presentation: pick a template, review the outline, draw the slides and export it as PDF, PPTX or editable PPTX."

policy:
  allow_implicit_invocation: true
