name: canvasanvil

services:
  app:
    image: canvasanvil/app:latest
    container_name: canvasanvil-app
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      PORT: 8080
      API_BODY_LIMIT: 25mb
      RECOGNIZER_URL: http://recognizer:8090
    ports:
      - "8001:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - recognizer
    restart: unless-stopped

  recognizer:
    image: canvasanvil/floorplan-recognizer:latest
    container_name: canvasanvil-recognizer
    build:
      context: ../../services/floorplan-recognizer
    restart: unless-stopped

