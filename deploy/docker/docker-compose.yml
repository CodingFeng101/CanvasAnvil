name: canvasanvil

services:
  app:
    image: canvasanvil/app:latest
    container_name: canvasanvil-app
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      PORT: 8080
      API_BODY_LIMIT: 25mb
      SLIDE_AGENT_API_KEY: ${SLIDE_AGENT_API_KEY:-}
      SLIDE_AGENT_MODEL: ${SLIDE_AGENT_MODEL:-}
      SLIDE_AGENT_BASE_URL: ${SLIDE_AGENT_BASE_URL:-https://api.openai.com/v1}
      SLIDE_AGENT_IMAGE_API_KEY: ${SLIDE_AGENT_IMAGE_API_KEY:-}
      SLIDE_AGENT_IMAGE_MODEL: ${SLIDE_AGENT_IMAGE_MODEL:-gpt-image-2}
      SLIDE_AGENT_IMAGE_BASE_URL: ${SLIDE_AGENT_IMAGE_BASE_URL:-https://api.openai.com/v1}
    ports:
      - "8001:8080"
    healthcheck:
      # The runtime image is Debian slim (no wget): Node's own fetch.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
