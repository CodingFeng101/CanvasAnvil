name: canvasanvil

services:
  app:
    image: canvasanvil/app:latest
    container_name: canvasanvil-app
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      PORT: 8080
      API_BODY_LIMIT: 25mb
    ports:
      - "8001:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  pptist-lab:
    image: canvasanvil/pptist-lab:latest
    container_name: canvasanvil-pptist-lab
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.pptist-lab
    ports:
      - "127.0.0.1:18003:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
